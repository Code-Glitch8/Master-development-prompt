name: Build Windows

# GitHub Actions only BUILDS and DISTRIBUTES Project Pilot. The built app runs locally on Windows and
# never contacts or depends on Actions.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "docs/**"]
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Version built
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('backend/app/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install Python dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c backend/constraints.txt
          pip install pyinstaller -c backend/constraints.txt
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package backend into a Windows executable (PyInstaller)
        run: pyinstaller packaging/project_pilot.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Smoke test the built executable
        run: python scripts/smoke_test.py build/dist/ProjectPilot/ProjectPilot.exe
      - name: Create release ZIP and checksums
        run: python scripts/build_dist.py --platform windows
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectPilot-${{ steps.ver.outputs.version }}-windows
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        shell: bash
        run: |
          {
            echo "### Windows build ${{ steps.ver.outputs.version }}"
            echo "Commit: \`${{ github.sha }}\`"
            echo '```'; cat release/SHA256SUMS.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
