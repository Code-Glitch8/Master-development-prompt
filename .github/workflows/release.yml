name: Release

# Push a tag like v0.1.0 (must equal backend/app/__init__.py __version__) to publish a GitHub Release
# with the Windows ZIP and SHA256SUMS. Uses only the built-in GITHUB_TOKEN; no paid services.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches application version
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('backend/app/__init__.py').read()).group(1))")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ v$v"; exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build-windows.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ProjectPilot-*-windows
          merge-multiple: true
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --title "Project Pilot $GITHUB_REF_NAME" --generate-notes $flags
