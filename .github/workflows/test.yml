name: Test

# Runs on every push and pull request. Nothing here is needed to RUN Project Pilot - it only checks the code.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -c backend/constraints.txt
          pip install pytest pytest-asyncio httpx pyyaml -c backend/constraints.txt
      - name: Dependency consistency check
        run: pip check
      - name: Compile check
        run: python -m compileall -q backend/app scripts
      - name: Python tests
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Summarize failures
        if: failure()
        shell: bash
        run: |
          echo "### Backend tests failed on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import xml.etree.ElementTree as ET
          try:
              for tc in ET.parse("pytest-report.xml").getroot().iter("testcase"):
                  for bad in list(tc.findall("failure")) + list(tc.findall("error")):
                      print(f"- `{tc.get('classname')}::{tc.get('name')}`: {(bad.get('message') or '')[:200]}")
          except Exception as e:
              print("No test report available:", e)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-${{ matrix.os }}
          path: pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency check (lockfile matches package.json)
        run: npm ls --all > /dev/null
      - name: Type check
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Security advisories (informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  repo-hygiene:
    name: Secret scan and workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No credentials committed
        run: python scripts/check_no_secrets.py
      - name: Workflow files are valid YAML
        run: |
          pip install pyyaml
          python -c "import glob,yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('ok')"
